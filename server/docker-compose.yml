version: '3.8'

services:
  arcdash-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcdash-sync-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:////app/data/arcdash.db
      - JWT_SECRET=arcdash_ultra_secure_sync_secret_key_change_in_prod_987234
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200 # 30 days
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
