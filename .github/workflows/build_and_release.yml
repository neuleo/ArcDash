name: ArcDash Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK and Upload Versioned Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD_NUM=$(git rev-list --count HEAD)
          VERSION="v${BASE_VERSION}"
          FULL_BUILD_VERSION="${BASE_VERSION}.${BUILD_NUM}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FULL_BUILD_VERSION=$FULL_BUILD_VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION (Build: $BUILD_NUM)"

      - name: Build Android APK (Debug)
        run: flutter build apk --debug

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-debug.apk release-apk/ArcDash-${{ env.VERSION }}.apk

      - name: Delete Old Rolling Release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-development --cleanup-tag -y || true

      - name: Publish Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "ArcDash ${{ env.VERSION }}"
          body: |
            Automatischer Release-Build **${{ env.VERSION }}** (Build `${{ env.FULL_BUILD_VERSION }}`, Commit `${{ github.sha }}`).
            Workflow-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-apk/ArcDash-${{ env.VERSION }}.apk
          prerelease: false

