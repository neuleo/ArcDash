name: Development APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-development-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish latest development APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify code formatting
        run: dart format --set-exit-if-changed lib test

      - name: Run static code analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build development APK
        run: flutter build apk --debug

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-debug.apk release-assets/ArcDash-development.apk
          sha256sum release-assets/ArcDash-development.apk > release-assets/ArcDash-development.apk.sha256

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-development
          target_commitish: ${{ github.sha }}
          name: ArcDash Latest Development
          body: |
            Automatischer Build von Commit ${{ github.sha }}.
            Workflow-Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
            Read-only-Entwicklungsversion. Nicht als stabil signiertes Produktionsrelease verwenden.
          prerelease: true
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
