name: arcdash
description: ArcDash — FarDriver controller tuning app for electric dirt bikes
publish_to: 'none'
version: 3.13.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bluetooth
  flutter_blue_plus: ^1.35.3

  # State management
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.69.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Permissions
  permission_handler: ^11.3.1

  # GPS / Location
  geolocator: ^13.0.1

  # Maps & Navigation (kostenlose OSM-Stack, siehe plan/16-map-navigation.md)
  flutter_map: ^8.1.0
  latlong2: ^0.10.1
  http: ^1.2.0

  # Data export
  csv: ^6.0.0

  # Utils
  intl: ^0.20.2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/basemaps/unmodified_basemap.heb
